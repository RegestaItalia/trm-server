name: Update registry certificates

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract and embed registry certificate chain
        run: python3 .github/scripts/update_registry_certificates.py

      - name: Validate generated changes
        run: git diff --check

      - name: Commit updated certificates
        run: |
          if git diff --quiet; then
            echo "Registry certificates are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ztrm_installer.prog.abap
          git commit -m "chore: update registry certificates"
          git push
